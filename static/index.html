<!doctype html>
<html lang="te">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <meta name="theme-color" content="#3f6b35" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%BE%3C/text%3E%3C/svg%3E" />
  <title>Krishi-Agent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700&family=Noto+Sans+Telugu:wght@400;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div id="app">
    <!-- ============ Farm Profile setup (one-time, literate-helper screen) ============ -->
    <section id="profile-screen" class="screen profile-screen">
      <div class="profile-card">
        <h1 class="brand">🌾 Krishi-Agent</h1>
        <p class="brand-sub">రైతు వివరాలు &middot; Farm Profile (one-time setup)</p>

        <form id="profile-form">
          <label class="field">
            <span class="field-label">State</span>
            <select id="state-select" required></select>
          </label>

          <label class="field">
            <span class="field-label">District</span>
            <select id="district-select" required></select>
          </label>

          <label class="field">
            <span class="field-label">Nearest Mandi</span>
            <input id="mandi-input" type="text" required placeholder="e.g. Warangal APMC" />
          </label>

          <label class="field">
            <span class="field-label">Crop</span>
            <select id="crop-select" required></select>
          </label>

          <div class="profile-actions">
            <button type="button" id="profile-cancel-btn" class="btn-secondary" hidden>Cancel</button>
            <button type="submit" class="btn-primary">Save &amp; Continue</button>
          </div>
        </form>
      </div>
    </section>

    <!-- ============ Ask screen (voice-first, minimal reading) ============ -->
    <section id="ask-screen" class="screen ask-screen" hidden>
      <div class="ask-card">
      <header class="ask-header">
        <h1 class="ask-brand">🌾 Krishi-Agent</h1>
        <button id="edit-profile-btn" class="icon-btn" aria-label="Edit farm profile" title="Edit profile">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 15a3 3 0 100-6 3 3 0 000 6z" />
            <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09a1.65 1.65 0 00-1-1.51 1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09a1.65 1.65 0 001.51-1 1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 114 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z" />
          </svg>
        </button>
      </header>

      <p class="ask-tagline">వాతావరణం, ధర, వ్యాధి — ఒకే గొంతులో</p>

      <p id="profile-chip" class="profile-chip"></p>

      <div id="error-banner" class="error-banner" hidden>
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10" />
          <line x1="12" y1="8" x2="12" y2="12" />
          <line x1="12" y1="16" x2="12.01" y2="16" />
        </svg>
        <p id="error-text"></p>
        <button id="error-dismiss-btn" class="error-dismiss-btn" aria-label="Dismiss">&times;</button>
      </div>

      <div class="type-row">
        <input id="question-input" type="text" placeholder="మీ ప్రశ్న టైప్ చేయండి... / Type your question..." />
        <button id="ask-typed-btn" class="send-btn" aria-label="Ask">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="19" x2="12" y2="5" />
            <polyline points="6 11 12 5 18 11" />
          </svg>
        </button>
      </div>

      <div class="stage" id="stage" data-state="idle">
        <p class="stage-caption" id="stage-caption"></p>
        <p class="record-timer" id="record-timer"></p>

        <div class="mic-wrap">
          <span class="pulse-ring ring-1"></span>
          <span class="pulse-ring ring-2"></span>
          <button id="mic-btn" class="mic-button" aria-label="Record your question">
            <!-- idle / listening: mic icon -->
            <svg class="icon icon-mic" viewBox="0 0 24 24" width="56" height="56" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z" />
              <path d="M19 10v2a7 7 0 01-14 0v-2" />
              <line x1="12" y1="19" x2="12" y2="23" />
              <line x1="8" y1="23" x2="16" y2="23" />
            </svg>
            <!-- thinking: animated dots -->
            <svg class="icon icon-thinking" viewBox="0 0 24 24" width="56" height="56">
              <circle class="dot dot-1" cx="6" cy="12" r="2.4" fill="currentColor" />
              <circle class="dot dot-2" cx="12" cy="12" r="2.4" fill="currentColor" />
              <circle class="dot dot-3" cx="18" cy="12" r="2.4" fill="currentColor" />
            </svg>
            <!-- ready, not playing: play icon -->
            <svg class="icon icon-play" viewBox="0 0 24 24" width="52" height="52" fill="currentColor">
              <path d="M8 5v14l11-7z" />
            </svg>
            <!-- ready, playing: pause icon (tap to stop) -->
            <svg class="icon icon-pause" viewBox="0 0 24 24" width="52" height="52" fill="currentColor">
              <rect x="6" y="5" width="4" height="14" rx="1" />
              <rect x="14" y="5" width="4" height="14" rx="1" />
            </svg>
          </button>
        </div>
      </div>

      <div class="secondary-row">
        <button id="photo-btn" class="icon-btn-lg" aria-label="Attach a leaf photo" title="Attach photo">
          <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z" />
            <circle cx="12" cy="13" r="4" />
          </svg>
        </button>
        <span class="secondary-row-label">ఆకు ఫోటో / Leaf photo</span>
        <input id="photo-input" type="file" accept="image/*" capture="environment" hidden />

        <div class="photo-preview-wrap">
          <img id="photo-preview" alt="Leaf photo preview" hidden />
          <button id="photo-remove-btn" class="photo-remove-btn" aria-label="Remove photo" hidden>&times;</button>
        </div>
      </div>

      <div id="mismatch-banner" class="mismatch-banner" hidden>
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 9v4" />
          <path d="M12 17h.01" />
          <path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z" />
        </svg>
        <p id="mismatch-text"></p>
        <button id="mismatch-update-btn" class="btn-secondary"></button>
      </div>

      <div id="answer-card" class="answer-card" hidden>
        <p id="heard-text" class="heard-text" hidden></p>
        <div id="detected-crop-chip" class="detected-crop-chip" hidden>
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M11 20A7 7 0 019.8 6.1C15.5 5 17 4.48 19 4c.34 6.3-1.72 9.8-3.16 11.24A7 7 0 0111 20z" />
            <path d="M11 20c0-1.5.5-4.5 2.5-6.5S17 12 20 12" />
          </svg>
          <span id="detected-crop-text"></span>
        </div>
        <p id="answer-text" class="answer-text"></p>
        <audio id="answer-audio" hidden></audio>
        <button id="ask-again-btn" class="btn-secondary ask-again">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="1 4 1 10 7 10" />
            <path d="M3.51 15a9 9 0 102.13-9.36L1 10" />
          </svg>
          Ask another question
        </button>
      </div>
      </div>
    </section>
  </div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
